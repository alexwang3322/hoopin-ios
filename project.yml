name: Hoopin
options:
  bundleIdPrefix: com.hoopin.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_CFBundleDisplayName: "Hoopin"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  Hoopin:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoopin.demo.Hoopin
        PRODUCT_NAME: "Hoopin"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Hoopin:
    build:
      targets:
        Hoopin: all
    run:
      config: Debug
